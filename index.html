<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une petite question...</title>
    <style>
        :root {
            --text-color: #4a4a4a;
            --primary-color: #ff9a9e;
            --primary-hover: #ff758c;
            --no-color: #d1d5db;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #ffdde1, #ee9ca7, #c9def4, #f6e5f5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        
        .step { display: none; opacity: 0; transition: opacity 0.5s ease; }
        .step.active { display: block; opacity: 1; animation: popIn 0.5s ease; }
        
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        h1 { font-size: 1.4rem; margin-bottom: 25px; color: #333; line-height: 1.4; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn-row { display: flex; gap: 20px; justify-content: center; align-items: center; width: 100%; min-height: 60px; }
        
        button {
            background-color: var(--primary-color); color: white; border: none;
            padding: 15px 24px; border-radius: 12px; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; width: 100%; font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        
        .btn-yes { width: auto; min-width: 130px; font-size: 1.1rem; }
        .btn-no { background-color: var(--no-color); width: auto; min-width: 120px; color: #555; box-shadow: none; transition: transform 0.2s ease, opacity 0.2s ease; }
        
        .option-btn { background-color: white; color: var(--text-color); border: 2px solid var(--primary-color); box-shadow: none; }
        .option-btn:hover { background-color: var(--primary-color); color: white; }
        
        .gif-container { margin-bottom: 20px; font-size: 4rem; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Animation du petit singe 3D */
        .monkey {
            position: fixed; width: 80px; height: 80px;
            animation: monkeyOrbit 12s linear infinite; z-index: 1; pointer-events: none;
        }
        @keyframes monkeyOrbit {
            0%   { left: -10vw; top: 5vh;   transform: scaleX(1); }
            20%  { left: 95vw;  top: 5vh;   transform: scaleX(1); }
            25%  { left: 95vw;  top: 5vh;   transform: rotate(90deg); }
            45%  { left: 95vw;  top: 90vh;  transform: rotate(90deg); }
            50%  { left: 95vw;  top: 90vh;  transform: scaleX(-1); }
            70%  { left: -10vw; top: 90vh;  transform: scaleX(-1); }
            75%  { left: -10vw; top: 90vh;  transform: rotate(-90deg); }
            95%  { left: -10vw; top: 5vh;   transform: rotate(-90deg); }
            100% { left: -10vw; top: 5vh;   transform: scaleX(1); }
        }

        .message-suppliant {
            color: #ff4757; font-weight: bold; margin-top: 15px; min-height: 24px;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <!-- Le vrai singe animé en 3D -->
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f412/512.gif" alt="Singe" class="monkey">

    <div class="container">
        
        <!-- Étape 1 -->
        <div id="step1" class="step active">
            <div class="gif-container">👀</div>
            <h1>Coucou Jessita, t'es pas chaud on se fait un date ?</h1>
            <div class="btn-row">
                <button id="btn-yes-1" class="btn-yes" onclick="nextStep(2)">Oui vasy chaud</button>
                <button id="btn-no-1" class="btn-no" onclick="shrinkBtn('btn-no-1', 'btn-yes-1')">non t'es mon bro</button>
            </div>
        </div>

        <!-- Étape 2 -->
        <div id="step2" class="step">
            <div class="gif-container">✨</div>
            <h1>Parfait tu veux qu'on se fasse quoi ?</h1>
            <div class="btn-group">
                <button class="option-btn" onclick="saveChoice('Activité', 'Pique-nique normal'); nextStep(3)">Pique-nique dans un parc (sandwichs, etc)</button>
                <button class="option-btn" onclick="saveChoice('Activité', 'Pique-nique Pepe Chicken'); nextStep(3)">Pique-nique dans un parc mais on se commande Pepe Chicken et on ramène des chips etc à côté en plus</button>
                <button id="btn-no-2" class="btn-no" onclick="shrinkBtn('btn-no-2', null)">arrête de raconter ta vie stp</button>
            </div>
        </div>

        <!-- Étape 3 -->
        <div id="step3" class="step">
            <div class="gif-container">📅</div>
            <h1>Tu veux faire ça quand ?</h1>
            <div class="btn-group">
                <button id="btn-yes-3" class="btn-yes" onclick="saveChoice('Date', 'Bientôt si Dieu le veut'); nextStep(4)">jte dis ça quand jsuis dispo mais bientot si Dieu le veut</button>
                <button id="btn-no-3" class="btn-no" onclick="jamaisClick()">jamais en vrai jvais pas te mentir</button>
            </div>
            <div id="message-jamais" class="message-suppliant"></div>
        </div>

        <!-- Étape 4 -->
        <div id="step4" class="step">
            <div class="gif-container">😌</div>
            <h1 id="titre-fin">Merci la plus belleee on se tiens au jus</h1>
            <p id="texte-fin">Clique en dessous pour valider tes choix.</p>
            <button id="btn-envoyer" class="btn-yes" style="margin-top: 20px;" onclick="sendSecretement()">Envoyer la réponse 💌</button>
        </div>

    </div>

    <script>
        let reponses = {};
        let noBtnSizes = {
            'btn-no-1': 1,
            'btn-no-2': 1,
            'btn-no-3': 1
        };

        // Liste des messages suppliants
        const messagesJamais = [
            "stpp la plus belle",
            "allez jessitaaaa"
        ];
        let messageIndex = 0;

        function saveChoice(question, reponse) {
            reponses[question] = reponse;
        }

        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            setTimeout(() => {
                document.getElementById('step' + stepNumber).classList.add('active');
            }, 100);
        }

        function shrinkBtn(noBtnId, yesBtnId) {
            const noBtn = document.getElementById(noBtnId);
            noBtnSizes[noBtnId] -= 0.25;
            
            if (noBtnSizes[noBtnId] <= 0.2) {
                noBtn.style.display = 'none';
            } else {
                noBtn.style.transform = `scale(${noBtnSizes[noBtnId]})`;
            }

            if (yesBtnId) {
                const yesBtn = document.getElementById(yesBtnId);
                let currentYesSize = parseFloat(window.getComputedStyle(yesBtn).getPropertyValue('transform').split(',')[3]) || 1;
                if (currentYesSize < 2) { 
                    yesBtn.style.transform = `scale(${currentYesSize + 0.15})`;
                }
            }
        }

        function jamaisClick() {
            shrinkBtn('btn-no-3', 'btn-yes-3');
            
            const messageDiv = document.getElementById('message-jamais');
            messageDiv.innerText = messagesJamais[messageIndex % messagesJamais.length];
            messageIndex++;
            
            // Relancer l'animation de tremblement
            messageDiv.style.animation = 'none';
            messageDiv.offsetHeight; 
            messageDiv.style.animation = 'shake 0.5s ease';
        }

        function sendSecretement() {
            const btn = document.getElementById('btn-envoyer');
            const titreFin = document.getElementById('titre-fin');
            const texteFin = document.getElementById('texte-fin');
            
            btn.innerText = "Envoi en cours... ⏳";
            btn.disabled = true;

            // --- ATTENTION: METTRE TON VRAI EMAIL CI-DESSOUS ---
            fetch("https://formsubmit.co/ajax/ton.email@gmail.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    Sujet: "Nouvelle réponse de Jessita pour le date !",
                    Activité: reponses['Activité'],
                    Date: reponses['Date']
                })
            })
            .then(response => response.json())
            .then(data => {
                titreFin.innerText = "C'est envoyé ! 🎉";
                texteFin.innerText = "Tes choix ont bien été enregistrés.";
                btn.style.display = "none";
            })
            .catch(error => {
                // Même si ça bloque un peu, on lui dit que c'est bon pour pas gâcher la surprise
                titreFin.innerText = "C'est envoyé ! 🎉"; 
                texteFin.innerText = "Tes choix ont bien été enregistrés.";
                btn.style.display = "none";
            });
        }
    </script>
</body>
</html>
